name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_ENV: production
          VITE_APP_ID: ci-stub
          VITE_SENTRY_DSN: ""
  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: build
    if: vars.E2E_BASE_URL != ''
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
      - name: Check deployment reachability
        id: reachability
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 10 "$E2E_BASE_URL" || echo "000")
          if [ "$STATUS" = "000" ]; then
            echo "::warning::E2E_BASE_URL unreachable. Skipping tests."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      - name: Run E2E smoke tests
        if: steps.reachability.outputs.skip != 'true'
        run: pnpm exec playwright test
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
